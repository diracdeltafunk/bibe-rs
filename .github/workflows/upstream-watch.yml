name: Upstream watch

# Once a week, check biber and biblatex upstream (tools/upstream/watch.py).
# bibers follows releases, so there are two reports:
#   * a new biber or biblatex release tag is the only thing to port. It goes
#     to the open `upstream-watch` issue, which gets a comment (and so a
#     notification) only when the findings change;
#   * unreleased activity (processing-code commits on biber's dev branch since
#     the vendor/biber pin, with fixes of our filed issues marked; a new .bcf
#     version or default data model on biblatex's dev branch) is information
#     only. It goes to the `upstream-preview` issue, whose body is edited in
#     place, which sends no notifications.
# Run by hand (Actions -> Upstream watch -> Run workflow); tick "dry run" to
# print the report without touching issues.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report only"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 tools/upstream/watch.py | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 tools/upstream/watch.py --issue "$GITHUB_REPOSITORY"
          fi
