name: Upstream watch

# Once a week, check biber and biblatex upstream for changes bibers may need to
# port: new releases, processing-code commits on biber's dev branch since the
# vendor/biber pin, a new .bcf version or default data model on biblatex's dev
# branch (tools/upstream/watch.py). Findings go to one open issue labelled
# `upstream-watch`, which gets a comment only when they change.
# Run by hand (Actions -> Upstream watch -> Run workflow); tick "dry run" to
# print the report without touching issues.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report only"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 tools/upstream/watch.py | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 tools/upstream/watch.py --issue "$GITHUB_REPOSITORY"
          fi
