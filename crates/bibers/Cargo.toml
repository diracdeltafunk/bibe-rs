[package]
name = "bibers"
description = "A fast, biber-compatible bibliography processor for biblatex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bibers"
path = "src/main.rs"

[dependencies]
bibers-core.workspace = true
jiff.workspace = true
mimalloc.workspace = true
dhat = { workspace = true, optional = true }

[features]
# Heap profiling: with this feature, bibers writes dhat-heap.json (peak heap
# by allocation site) on exit; see tools/bench/dhat_report.py.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
bibers-testkit.workspace = true
perl-compat.workspace = true
relaxng.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
