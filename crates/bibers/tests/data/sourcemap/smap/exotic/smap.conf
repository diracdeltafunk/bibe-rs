<?xml version="1.0" encoding="UTF-8"?>
<!-- Source map features the corpus exercises rarely or not at all
     (crates/bibers/tests/sourcemap.rs). -->
<config>
  <sourcemap>
    <maps datatype="bibtex" map_overwrite="1">
      <!-- entry deletion (first: biber crashes if a nocited entry was created
           by this entry's maps before the deletion and is in the citekeys, i.e.
           nocite or allkeys: restricted to section 0) -->
      <map refsection="0">
        <map_step map_field_source="entrykey" map_match="^drop" map_final="1"/>
        <map_step map_entry_new="made-before-drop" map_entry_newtype="misc"/>
        <map_step map_entry_null="1"/>
      </map>
      <!-- refsection -->
      <map refsection="1">
        <map_step map_field_set="usera" map_field_value="SEC1"/>
      </map>
      <!-- per_nottype + append -->
      <map>
        <per_nottype>ARTICLE</per_nottype>
        <map_step map_field_set="userb" map_field_value="+NOTART" map_append="1"/>
      </map>
      <!-- notmatchi, final -->
      <map>
        <map_step map_field_source="title" map_notmatchi="^the" map_final="1"/>
        <map_step map_field_set="userc" map_field_value="not-the:$1"/>
      </map>
      <!-- matchesi / matches -->
      <map>
        <map_step map_field_source="note" map_matchesi="Foo, BAR" map_replace="x, y"/>
        <map_step map_field_source="howpublished" map_matches="a,b,c" map_replace="1,2"/>
      </map>
      <!-- appendstrict -->
      <map>
        <map_step map_field_set="addendum" map_field_value="-app" map_appendstrict="1"/>
      </map>
      <!-- cite conditions -->
      <map>
        <map_step map_entrykey_cited="1" map_field_set="usere" map_field_value="cited" map_append="1"/>
        <map_step map_entrykey_nocited="1" map_field_set="usere" map_field_value="nocited" map_append="1"/>
        <map_step map_entrykey_citedornocited="1" map_field_set="usere" map_field_value="+either" map_append="1"/>
        <map_step map_entrykey_allnocited="1" map_field_set="usere" map_field_value="+all" map_append="1"/>
        <map_step map_entrykey_starnocited="1" map_field_set="usere" map_field_value="+star" map_append="1"/>
        <map_step map_entrykey_cited="1" map_final="1"/>
        <map_step map_field_set="usere" map_field_value="+after-final" map_append="1"/>
      </map>
      <!-- foreach over a datafield set -->
      <map map_foreach="settitles">
        <map_step map_field_source="$MAPLOOP" map_match="(\w)(\w)" map_final="1"/>
        <map_step map_field_set="verba" map_field_value="[$MAPLOOP:$1$2$3$4]" map_append="1"/>
      </map>
      <!-- foreach over a field: new entries keyed with $MAPUNIQ -->
      <map map_foreach="keywords">
        <map_step map_entry_new="kw-$MAPLOOP-$MAPUNIQ" map_entry_newtype="Misc" map_entry_nocite="1"/>
        <map_step map_entrytarget="kw-$MAPLOOP-$MAPUNIQVAL" map_field_set="title" map_field_value="KW $MAPLOOP"/>
        <map_step map_entrytarget="kw-$MAPLOOP-$MAPUNIQVAL" map_type_source="Misc" map_type_target="BOOK"/>
        <map_step map_entrytarget="kw-$MAPLOOP-$MAPUNIQVAL" map_type_source="misc" map_type_target="BOOK"/>
      </map>
      <!-- foreach over a literal list, $MAPLOOP "0" is not substituted -->
      <map map_foreach="x, 0,y">
        <map_step map_field_set="verbb" map_field_value="$MAPLOOP" map_append="1"/>
      </map>
      <!-- clone; entrykey of a clone is the original key -->
      <map>
        <map_step map_field_source="entrykey" map_match="^(cl)(.*)$" map_final="1"/>
        <map_step map_entry_clone="clone-$1$2"/>
        <map_step map_entrytarget="clone-$1$2" map_field_source="entrykey" map_field_target="note"/>
        <map_step map_entrytarget="clone-$1$2" map_field_source="entrykey"/>
        <map_step map_entrytarget="clone-$1$2" map_field_set="userf" map_origfieldval="1"/>
        <map_step map_entrytarget="clone-$1$2" map_field_set="userf" map_origfield="1" map_append="1"/>
        <map_step map_entry_new="nonew"/>
        <map_step map_entrytarget="nosuchentry" map_field_set="title" map_field_value="x"/>
      </map>
      <!-- origfieldval of "0" is skipped; field mapped onto itself is deleted -->
      <map>
        <map_step map_field_source="volume"/>
        <map_step map_field_set="userd" map_origfieldval="1"/>
        <map_step map_field_source="pages" map_field_target="pages"/>
      </map>
      <!-- m//g captures and $0, $10; notmatch sets $1 to 1 -->
      <map>
        <map_step map_field_source="author" map_match="(\p{Lu})\p{Ll}+" map_final="1"/>
        <map_step map_field_set="verbc" map_field_value="$1$2$3|$0|\$1"/>
        <map_step map_field_source="author" map_match="$1"/>
        <map_step map_field_source="title" map_notmatch="zzz"/>
        <map_step map_field_set="listd" map_field_value="neg:$1"/>
        <map_step map_field_source="title" map_matchi="(t)(h)(e)(\s)(.)(.)(.)(.)(.)(.)"/>
        <map_step map_field_source="title" map_match="$10"/>
        <map_step map_field_set="liste" map_field_value="ten:$10"/>
      </map>
      <!-- case-insensitive replace with case modifiers; entrykey cannot be replaced -->
      <map>
        <map_step map_field_source="location" map_matchi="^(lon)" map_replace="\U$1\E-"/>
        <map_step map_field_source="entrykey" map_match="." map_replace="X"/>
        <map_step map_field_source="entrykey" map_field_target="userf"/>
      </map>
      <!-- origentrytype, type change (fc) -->
      <map>
        <per_type>BOOK</per_type>
        <map_step map_type_source="BOOK" map_type_target="MvBook"/>
        <map_step map_field_set="verbc" map_origentrytype="1" map_append="1"/>
      </map>
      <!-- map-level overwrite=0 beats the maps-level 1 -->
      <map map_overwrite="0">
        <map_step map_field_set="title" map_field_value="SHOULD NOT" map_final="1"/>
        <map_step map_field_set="lista" map_field_value="not reached"/>
      </map>
      <!-- notfield -->
      <map>
        <map_step map_notfield="editor" map_field_set="listb" map_field_value="no editor"/>
        <map_step map_notfield="title" map_final="1"/>
        <map_step map_field_set="listc" map_field_value="has title"/>
      </map>
      <!-- per_datasource -->
      <map>
        <per_datasource>test.bib</per_datasource>
        <map_step map_field_set="usera" map_field_value="+ds" map_append="1"/>
      </map>
      <map>
        <per_datasource>other.bib</per_datasource>
        <map_step map_field_set="usera" map_field_value="+other" map_append="1"/>
      </map>
    </maps>
  </sourcemap>
</config>
