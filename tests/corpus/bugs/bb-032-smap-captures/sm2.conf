<?xml version="1.0" encoding="UTF-8"?>
<config>
  <sourcemap>
    <maps datatype="bibtex">
      <map><map_step map_field_source="title" map_match="(?&lt;rest&gt;big)" map_replace="[$+{rest}]"/></map>
      <map><map_step map_field_source="note" map_match="(\w)(\w+)" map_replace="\L$1$2\E!"/></map>
      <map><map_step map_field_source="series" map_match="(?&lt;x&gt;Q)" map_replace="[$1]"/></map>
      <map>
        <map_step map_field_source="location" map_match="(o)" />
        <map_step map_field_set="addendum" map_field_value="[$1|$2|$3|$0]"/>
      </map>
      <map>
        <map_step map_field_source="edition" map_notmatch="zzz" />
        <map_step map_field_set="usera" map_field_value="[$1]"/>
      </map>
      <map>
        <map_step map_field_source="publisher" map_match="b" map_final="1"/>
        <map_step map_field_set="userb" map_field_value="publisher-had-b"/>
      </map>
    </maps>
  </sourcemap>
</config>
