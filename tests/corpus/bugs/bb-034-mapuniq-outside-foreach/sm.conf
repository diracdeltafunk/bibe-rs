<?xml version="1.0" encoding="UTF-8"?>
<config>
  <sourcemap>
    <maps datatype="bibtex">
      <map>
        <map_step map_field_source="series" map_match="^(.)(.)"/>
        <map_step map_field_set="addendum" map_field_value="$2-$1-$MAPUNIQ"/>
      </map>
      <map><map_step map_field_set="usera" map_field_value="u-$MAPLOOP"/></map>
    </maps>
  </sourcemap>
</config>
