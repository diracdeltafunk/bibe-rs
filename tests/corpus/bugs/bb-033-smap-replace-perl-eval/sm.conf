<?xml version="1.0" encoding="UTF-8"?>
<config>
  <sourcemap>
    <maps datatype="bibtex">
      <map><map_step map_field_source="title" map_match="(\p{Lu})(\w+)\s+(?&lt;rest&gt;.*)" map_replace="[$3]\L$1$2\E+$+{rest}"/></map>
      <map><map_step map_field_source="note" map_match="(?&lt;=x)(\d+)(?=y)" map_replace="&lt;$1&gt;"/></map>
      <map><map_step map_field_source="publisher" map_match="(a)(b)?" map_replace="$1&quot;"/></map>
      <map><map_step map_field_source="location" map_match="(\w+)" map_replace="@{[ uc $1 ]}"/></map>
      <map><map_step map_field_source="edition" map_match="(\d)\1" map_replace="dbl"/></map>
      <map><map_step map_field_source="howpublished" map_match="\x{263A}|\N{U+263B}" map_replace="smile"/></map>
      <map><map_step map_field_source="organization" map_match="(?i)ABC" map_replace="${\ scalar reverse 'olleh'}"/></map>
      <map><map_step map_field_source="type" map_match="t" map_replace="\$1 \u\LfOO $&amp;"/></map>
    </maps>
  </sourcemap>
</config>
