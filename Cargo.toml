[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Artistic-2.0"
repository = "https://github.com/diracdeltafunk/bibe-rs"
authors = ["the bibe-rs contributors"]

[workspace.dependencies]
bibers-core = { path = "crates/bibers-core" }
bibers-testkit = { path = "crates/testkit" }
btparse = { path = "crates/btparse" }
latex-recode = { path = "crates/latex-recode" }
ucollate = { path = "crates/ucollate" }
perl-compat = { path = "crates/perl-compat" }
relaxng = { path = "crates/relaxng" }

anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
similar = "2"
wait-timeout = "0.2"
# Pinned: 0.1.24 is the last release on Unicode 16.0.0, the Unicode version of
# biber's perl 5.42 (docs/PLAN.md §4 risk 2); 0.1.25 moved to Unicode 17.
unicode-normalization = "=0.1.24"
roxmltree = "0.21"
memchr = "2"
serde_json = "1"
rustc-hash = "2"
# Data parallelism for the per-entry loops (bibers_core::par, DC-068).
rayon = "1.11"
# The global allocator of the bibers binary: less memory than the system
# allocators (fragmentation) and faster. mimalloc 2 rather than 3: 5-15%
# lower peak RSS on the benchmarks at the same speed.
mimalloc = { version = "0.1.48", default-features = false, features = ["v2"] }
# Short strings stored inline (the generic list state, `model::PV`).
compact_str = "0.9"
# Heap profiling of the bibers binary (feature `dhat-heap`, docs/M5.md).
dhat = "0.3"
# Vectors one pointer wide (the generic list state, `model::PV`).
thin-vec = "0.2"
md-5 = "0.10"
# Local time for the log's "=== <date>" line. Not chrono: its `clock` feature
# links CoreFoundation on macOS, which costs ~1 ms at every process start.
jiff = "0.2.15"
pcre2 = "0.2.11"
sha2 = "0.10"
# Remote data sources (DC-032): pure-Rust TLS (ring provider); webpki-roots is
# Mozilla's CA list, like biber's bundled Mozilla::CA.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# perl-compat's exhaustive per-code-point tests are slow unoptimised.
[profile.dev.package.perl-compat]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3

# `cargo build --profile dist`: the release binaries (.github/workflows/release.yml).
[profile.dist]
inherits = "release"
strip = true

# `cargo build --profile profiling`: release with debug info, for samply etc.
[profile.profiling]
inherits = "release"
debug = true
