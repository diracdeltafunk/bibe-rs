[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Artistic-2.0"
repository = "https://github.com/diracdeltafunk/bibe-rs"
authors = ["the bibe-rs contributors"]

[workspace.dependencies]
bibers-core = { path = "crates/bibers-core" }
bibers-testkit = { path = "crates/testkit" }
btparse = { path = "crates/btparse" }
latex-recode = { path = "crates/latex-recode" }
ucollate = { path = "crates/ucollate" }
perl-compat = { path = "crates/perl-compat" }

anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
similar = "2"
wait-timeout = "0.2"
# Pinned: 0.1.24 is the last release on Unicode 16.0.0, the Unicode version of
# biber's perl 5.42 (docs/PLAN.md §4 risk 2); 0.1.25 moved to Unicode 17.
unicode-normalization = "=0.1.24"
roxmltree = "0.21"
memchr = "2"
serde_json = "1"
rustc-hash = "2"
md-5 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
