[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Artistic-2.0"
repository = "https://github.com/diracdeltafunk/bibe-rs"
authors = ["the bibe-rs contributors"]

[workspace.dependencies]
bibers-core = { path = "crates/bibers-core" }
bibers-testkit = { path = "crates/testkit" }
btparse = { path = "crates/btparse" }
latex-recode = { path = "crates/latex-recode" }
ucollate = { path = "crates/ucollate" }
perl-compat = { path = "crates/perl-compat" }

anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
similar = "2"
wait-timeout = "0.2"
pcre2 = "0.2.11"
# Pinned: 0.1.24 implements Unicode 16.0.0 (= perl 5.42); 0.1.25 moved to Unicode 17.
unicode-normalization = "=0.1.24"
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# perl-compat's exhaustive per-code-point tests are slow unoptimised.
[profile.dev.package.perl-compat]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3
